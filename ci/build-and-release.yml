name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION (tag: v$VERSION)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Release Keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias reminderkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass reminder123 \
            -keypass reminder123 \
            -dname "CN=Smart Reminder, OU=Mobile, O=SmartReminder, L=Global, S=Global, C=US"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: reminder123
          KEY_ALIAS: reminderkey
          KEY_PASSWORD: reminder123

      - name: Locate and Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found! Checking debug APK..."
            cd android && ./gradlew assembleDebug && cd ..
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          DEST_NAME="SmartReminder-${{ env.TAG_NAME }}.apk"
          cp "$APK_PATH" "./$DEST_NAME"
          echo "APK_FILE=./$DEST_NAME" >> $GITHUB_ENV
          echo "APK successfully prepared at ./$DEST_NAME"
          ls -lh "./$DEST_NAME"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartReminder-${{ env.TAG_NAME }}
          path: ${{ env.APK_FILE }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Smart Reminder ${{ env.TAG_NAME }} (Native Kotlin)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.APK_FILE }}
          body: |
            ## 📱 Smart Reminder ${{ env.TAG_NAME }} (100% Native Kotlin)

            ### 🚀 Pure Native Android Rebuild
            - **100% Native Kotlin App**: Completely replaced Capacitor/web wrapper with a high-performance native Android application.
            - **Exact Real-Time Alarms (`AlarmManager.setAlarmClock`)**: Alarms fire at the exact second even during Doze mode, battery saver, and lock screen.
            - **Audible Ringtone & Vibration**: Rings with the system alarm audio stream and looping ringtone, with full-screen incoming alarm wake-up.
            - **Full Offline SQLite Storage**: Instant local CRUD operations, recurring rollover (Daily, Weekly, Monthly), and stats.
            - **Reboot Rescheduling**: Automatically restores all scheduled alarms on device restart.
            - **In-App Updater**: One-tap background check and direct APK update from GitHub Releases.

            ### 📦 Download & Install:
            Download **[SmartReminder-${{ env.TAG_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/SmartReminder-${{ env.TAG_NAME }}.apk)** below and install it directly on your Android phone!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
