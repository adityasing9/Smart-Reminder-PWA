name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.2)'
        required: false
        default: '2.0.2'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION (tag: v$VERSION)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Release Keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias reminderkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass reminder123 \
            -keypass reminder123 \
            -dname "CN=Smart Reminder, OU=Mobile, O=SmartReminder, L=Global, S=Global, C=US"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release and Debug APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: reminder123
          KEY_ALIAS: reminderkey
          KEY_PASSWORD: reminder123

      - name: Locate and Prepare APKs
        id: prepare_apk
        run: |
          RELEASE_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          RELEASE_NAME="SmartReminder-${{ env.TAG_NAME }}.apk"
          DEBUG_NAME="SmartReminder-${{ env.TAG_NAME }}-debug.apk"

          cp "$RELEASE_PATH" "./$RELEASE_NAME"
          cp "$DEBUG_PATH" "./$DEBUG_NAME"

          echo "RELEASE_APK=./$RELEASE_NAME" >> $GITHUB_ENV
          echo "DEBUG_APK=./$DEBUG_NAME" >> $GITHUB_ENV
          ls -lh ./SmartReminder*.apk

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartReminder-${{ env.TAG_NAME }}
          path: ./SmartReminder*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Smart Reminder ${{ env.TAG_NAME }} (Native Kotlin)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.DEBUG_APK }}
          body: |
            ## 📱 Smart Reminder ${{ env.TAG_NAME }} (100% Native Kotlin)

            ### 🚀 Pure Native Android Rebuild
            - **100% Native Kotlin App**: Completely replaced Capacitor/web wrapper with a high-performance native Android application.
            - **Clean Security Profile**: Zero dangerous permissions. No package-installer or media-playback permission flags.
            - **Exact Real-Time Alarms (`AlarmManager.setAlarmClock`)**: Alarms fire at the exact second even during Doze mode, battery saver, and lock screen.
            - **Audible Ringtone & Vibration**: Rings with the system alarm audio stream and looping ringtone, with full-screen incoming alarm wake-up.
            - **Full Offline SQLite Storage**: Instant local CRUD operations, recurring rollover (Daily, Weekly, Monthly), and stats.
            - **Reboot Rescheduling**: Automatically restores all scheduled alarms on device restart.

            ### 📦 Download & Install:
            - **Standard Release**: **[SmartReminder-${{ env.TAG_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/SmartReminder-${{ env.TAG_NAME }}.apk)**
            - **Developer / Debug Build**: **[SmartReminder-${{ env.TAG_NAME }}-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/SmartReminder-${{ env.TAG_NAME }}-debug.apk)** *(Signed with official Android debug cert; trusted by Play Protect for testing)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
