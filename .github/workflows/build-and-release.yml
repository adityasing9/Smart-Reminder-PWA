name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION (tag: v$VERSION)"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: frontend
        run: npm run build:export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://smart-reminder-pwa.onrender.com' }}

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore frontend/android/app/release.keystore \
            -alias reminderkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass reminder123 \
            -keypass reminder123 \
            -dname "CN=Smart Reminder, OU=Mobile, O=SmartReminder, L=Global, S=Global, C=US"

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Signed Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: reminder123
          KEY_ALIAS: reminderkey
          KEY_PASSWORD: reminder123

      - name: Locate and Prepare APK
        id: prepare_apk
        run: |
          APK_PATH=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found! Checking debug APK..."
            cd frontend/android && ./gradlew assembleDebug && cd ../..
            APK_PATH=$(find frontend/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          DEST_NAME="SmartReminder-${{ env.TAG_NAME }}.apk"
          cp "$APK_PATH" "./$DEST_NAME"
          echo "APK_FILE=./$DEST_NAME" >> $GITHUB_ENV
          echo "APK successfully prepared at ./$DEST_NAME"
          ls -lh "./$DEST_NAME"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartReminder-${{ env.TAG_NAME }}
          path: ${{ env.APK_FILE }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Smart Reminder ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.APK_FILE }}
          body: |
            ## 📱 Smart Reminder ${{ env.TAG_NAME }}

            ### ✨ What's New:
            - **Native Android App**: Full offline-first scheduling assistant.
            - **Proper High-Priority Notifications**: Native device alarms, vibration, and heads-up notifications.
            - **In-App Updater**: Direct check and download of new updates from within the app.

            ### 📦 Download & Install:
            Download **[SmartReminder-${{ env.TAG_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/SmartReminder-${{ env.TAG_NAME }}.apk)** below and install it directly on your Android phone!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
